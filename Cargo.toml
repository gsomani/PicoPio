[package]
name = "PicoUart"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]

embassy-executor = { git = "https://github.com/embassy-rs/embassy", rev = "665cc1e2a8811cbeaa8d673a1d07d06f037be279", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-rp = { git = "https://github.com/embassy-rs/embassy", rev = "665cc1e2a8811cbeaa8d673a1d07d06f037be279", features = ["rp235xa", "defmt", "time-driver", "critical-section-impl", "binary-info"] }
embassy-time = { git = "https://github.com/embassy-rs/embassy", rev = "665cc1e2a8811cbeaa8d673a1d07d06f037be279", features = ["defmt", "defmt-timestamp-uptime"] }
cortex-m = { version = "0.7", features = ["inline-asm"] }
cortex-m-rt = "0.7"
defmt = "1"
defmt-rtt = "1"
panic-probe = { version = "1", features = ["print-defmt"] }

[profile.release]
debug = 2
